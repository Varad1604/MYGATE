# Public entrypoint — one origin, four apps.
#   /            admin console
#   /r/          resident PWA
#   /g/          guard PWA
#   /api,/files  backend (proxied through admin's rewrite too)
server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  location / {
    proxy_pass http://admin:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # PWAs are served under subpaths; strip the prefix before proxying.
  location /g/ {
    rewrite ^/g/(.*)$ /$1 break;
    proxy_pass http://guard;
    proxy_set_header Host $host;
  }

  location /r/ {
    rewrite ^/r/(.*)$ /$1 break;
    proxy_pass http://resident;
    proxy_set_header Host $host;
  }

  location ~ ^/(api|files)/ {
    proxy_pass http://admin:3000;   # admin rewrites these to api:4000
    proxy_buffering off;            # SSE
    proxy_read_timeout 75s;
    proxy_set_header Host $host;
  }
}
